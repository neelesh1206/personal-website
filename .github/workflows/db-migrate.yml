name: DB Migrate (Production)

# Applies Drizzle migrations to the production Neon branch.
#
# Triggers:
#   1. Manual — Actions → "DB Migrate (Production)" → Run workflow
#   2. Automatic — push to main that changes any file under db/migrations/
#      (so a no-op commit never spins up a runner)
#
# Required repo secret: PROD_DATABASE_URL
#   Neon connection string with sslmode=require. Scoped to GitHub
#   Environment `production` so adding an approval gate is one click.
#
# Drizzle's __drizzle_migrations table makes apply idempotent — re-running
# this workflow is safe.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'drizzle.config.ts'
      - 'lib/db/schema.ts'
      - '.github/workflows/db-migrate.yml'

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

env:
  # Run actions/* with Node 24. Default flips Jun 2 2026; this silences
  # the deprecation warning today.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations
        run: |
          echo "Migrations in repo:"
          ls -1 db/migrations/*.sql 2>/dev/null || echo "  (none)"

      - name: Apply migrations to production Neon branch
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set"
            exit 1
          fi
          npm run db:migrate:ci

      - name: Verify schema
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          node -e "
          const {neon} = require('@neondatabase/serverless');
          const sql = neon(process.env.DATABASE_URL);
          sql\`SELECT to_regclass('contacts') AS exists, version() AS pg\`
            .then(r => { console.log('Result:', r); if (!r[0].exists) process.exit(2); })
            .catch(e => { console.error(e); process.exit(1); });
          "
